name: Vercel Visual QA Screenshots

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Required Vercel Preview/Production URL to capture"
        required: true
        type: string
      capture_webgl_fallback:
        description: "Capture Playwright-mocked WebGL fallback screenshots"
        required: false
        default: true
        type: boolean
      routes:
        description: "Optional comma-separated route list"
        required: false
        default: "/,/measurements,/materials,/assembly,/configurator,/configurator-3d,/admin"
        type: string
      upload_retention_days:
        description: "Artifact retention days"
        required: false
        default: "14"
        type: string

permissions:
  contents: read

env:
  VISUAL_QA_OUTPUT_DIR: visual-qa-screenshots

jobs:
  capture:
    name: Capture Vercel visual QA screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate workflow inputs
        shell: bash
        env:
          TARGET_URL: ${{ inputs.target_url }}
          UPLOAD_RETENTION_DAYS: ${{ inputs.upload_retention_days }}
        run: |
          set -euo pipefail
          if [[ -z "${TARGET_URL}" ]]; then
            echo "target_url is required" >&2
            exit 1
          fi
          if [[ "${TARGET_URL}" != https://* ]]; then
            echo "target_url must start with https://" >&2
            exit 1
          fi
          if [[ "${TARGET_URL}" == *localhost* || "${TARGET_URL}" == *127.0.0.1* ]]; then
            echo "target_url must not point to localhost" >&2
            exit 1
          fi
          if [[ -z "${UPLOAD_RETENTION_DAYS}" || "${UPLOAD_RETENTION_DAYS}" =~ [^0-9] ]]; then
            echo "upload_retention_days must be a positive integer string" >&2
            exit 1
          fi
          if (( UPLOAD_RETENTION_DAYS < 1 || UPLOAD_RETENTION_DAYS > 90 )); then
            echo "upload_retention_days must be between 1 and 90" >&2
            exit 1
          fi
          echo "Input validation passed for HTTPS Vercel visual QA target."

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture screenshots
        id: capture
        continue-on-error: true
        env:
          TARGET_URL: ${{ inputs.target_url }}
          VISUAL_QA_ROUTES: ${{ inputs.routes }}
          CAPTURE_WEBGL_FALLBACK: ${{ inputs.capture_webgl_fallback }}
          VISUAL_QA_OUTPUT_DIR: ${{ env.VISUAL_QA_OUTPUT_DIR }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          VISUAL_QA_CAPTURE_TIMEOUT_MS: "75000"
          VISUAL_QA_GOTO_TIMEOUT_MS: "30000"
          VISUAL_QA_SETTLE_TIMEOUT_MS: "12000"
          VISUAL_QA_SCREENSHOT_TIMEOUT_MS: "15000"
        run: node scripts/capture-vercel-visual-qa-screenshots.mjs

      - name: Upload visual QA screenshots artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vercel-visual-qa-screenshots-${{ github.run_id }}
          path: ${{ env.VISUAL_QA_OUTPUT_DIR }}/
          if-no-files-found: warn
          retention-days: ${{ inputs.upload_retention_days }}

      - name: Validate screenshot manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const manifestPath = 'visual-qa-screenshots/manifest.json';
          let manifest;
          try {
            manifest = JSON.parse(await readFile(manifestPath, 'utf8'));
          } catch (error) {
            console.error(`[visual-qa] Manifest validation failed: ${manifestPath} is missing or invalid.`);
            console.error(error instanceof Error ? error.message : String(error));
            process.exit(1);
          }
          const summary = manifest.summary || {};
          const screenshotsWritten = Number(summary.screenshotsWritten || 0);
          const failed = Number(summary.failed || summary.error || 0);
          const timedOut = Number(summary.timeout || 0);
          console.log(`[visual-qa] Manifest summary: total=${summary.total ?? 0} screenshotsWritten=${screenshotsWritten} ok=${summary.ok ?? 0} warning=${summary.warning ?? 0} failed=${failed} timeout=${timedOut}`);
          if (manifest.lastAttemptedCapture) {
            console.log(`[visual-qa] Last attempted capture: ${JSON.stringify(manifest.lastAttemptedCapture)}`);
          }
          if (screenshotsWritten <= 0) {
            console.error('[visual-qa] Manifest validation failed: zero screenshots were written.');
            process.exit(1);
          }
          if (failed > 0 || timedOut > 0) {
            console.error('[visual-qa] Manifest validation failed: one or more captures failed/timed out. Artifact was uploaded for diagnostics.');
            process.exit(1);
          }
          console.log('[visual-qa] Manifest validation passed.');
          NODE
