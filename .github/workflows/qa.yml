name: QA

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    name: Fast CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Infrastructure inventory check
        run: node scripts/infrastructure-audit-report.mjs --check

      - name: Generate infrastructure inventory artifact
        run: node scripts/infrastructure-audit-report.mjs

      - name: Upload infrastructure inventory artifact
        uses: actions/upload-artifact@v4
        with:
          name: repository-infrastructure-inventory
          path: docs/audits/generated/
          retention-days: 14

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Typecheck API
        run: npm run typecheck:api

      - name: Build frontend
        run: npm run build

      - name: Fast active tests
        run: |
          npm run test:constructor-store
          npm run test:constructor-payload
          npm run test:production-preview
          npm run test:constructor-flow
          npm run test:checkout-submit-hook
          npm run test:constructor-pii-order
          npm run test:constructor-three
          npm run test:constructor-three-safety
          npm run test:pricing-catalog
          npm run test:pricing-engine
          npm run test:delivery
          npm run test:pricing-final
          npm run test:geometry
          npm run test:production-export

      - name: Coverage snapshot
        env:
          COVERAGE_MIN_BYTES: 15
        run: node scripts/coverage-report.mjs

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-summary
          path: coverage/
          retention-days: 14

      - name: Check CSS architecture
        run: npm run check:css-architecture

      - name: Check production geometry architecture
        run: npm run check:production-geometry-architecture
