name: QA

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Infrastructure inventory check
        run: node scripts/infrastructure-audit-report.mjs --check

      - name: Generate infrastructure inventory artifact
        run: node scripts/infrastructure-audit-report.mjs

      - name: Upload infrastructure inventory artifact
        uses: actions/upload-artifact@v4
        with:
          name: repository-infrastructure-inventory
          path: docs/audits/generated/
          retention-days: 14

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Typecheck API
        run: npm run typecheck:api

      - name: Build frontend
        run: npm run build

      - name: Check CSS architecture
        run: npm run check:css-architecture

      - name: Check production geometry architecture
        run: npm run check:production-geometry-architecture
